<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CYLA - Entrar</title>
<link rel="stylesheet" href="auth.css">
<script src="seed.js"></script>
<script src="presets.js"></script>
<script src="storage.js"></script>
<script src="app.js"></script>
<link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css" rel="stylesheet">
</head>
<body>
<div class="wrapper">
  <div class="logo-area">
    <div class="logo-icone"><i class="ti ti-shield-check"></i></div>
    <div class="logo-texto">
      <h2>CYLA</h2>
      <span>Control Your Life Again</span>
    </div>
  </div>
  <h1>Entrar</h1>
  <p class="subtitulo">Bem-vindo de volta</p>
  <form id="form-login">
    <div class="input-box">
      <input type="email" id="login-email" placeholder="E-mail" required>
      <i class="ti ti-mail"></i>
    </div>
    <div class="input-box">
      <input type="password" id="login-senha" placeholder="Senha" required>
      <i class="ti ti-lock"></i>
    </div>
    <div class="remember-forgot">
      <label><input type="checkbox"> Lembrar de mim</label>
      <a href="esqueceu-senha.html">Esqueci minha senha</a>
    </div>
    <div id="login-erro" style="display:none;color:#D85A30;font-size:13px;text-align:center;margin:-4px 0 12px;"></div>
    <button type="submit" class="btn">Entrar</button>
  </form>
  <div class="register-link">
    <p>Não tem conta? <a href="criar-conta.html">Criar conta</a></p>
  </div>
</div>
</body>
</html>
