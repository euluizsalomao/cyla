<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CYLA - Editar perfil</title>
<link rel="stylesheet" href="cyla.css">
<script src="seed.js"></script>
<script src="presets.js"></script>
<script src="storage.js"></script>
<script src="app.js"></script>
<link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css" rel="stylesheet">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="brand-icon"><i class="ti ti-shield-check"></i></div>
      <div><div class="brand-name">CYLA</div><div class="brand-sub">Control Your Life Again</div></div>
    </div>
    <div class="sidebar-user">
      <div class="user-avatar">U</div>
      <div><div class="user-name">Usuário</div><div class="user-handle">@usuario</div></div>
    </div>
    <nav class="sidebar-nav">
      <a href="home.html" class="nav-link"><i class="ti ti-home"></i> Início</a>
      <a href="progresso.html" class="nav-link"><i class="ti ti-chart-bar"></i> Progresso</a>
      <a href="habitos.html" class="nav-link"><i class="ti ti-list-check"></i> Meus hábitos</a>
      <a href="amigos.html" class="nav-link"><i class="ti ti-users"></i> Amigos</a>
      <a href="perfil.html" class="nav-link active"><i class="ti ti-user-circle"></i> Meu perfil</a>
    </nav>
    <div class="sidebar-reg">
      <a href="registro.html" class="btn-register"><i class="ti ti-plus"></i> Registrar hoje</a>
    </div>
  </aside>
  <div class="main-content">
    <div class="topbar">
      <div class="topbar-brand">
        <div class="brand-icon"><i class="ti ti-shield-check"></i></div>
        <span class="topbar-name">CYLA</span>
      </div>
      <div class="topbar-avatar">U</div>
    </div>
    <div class="page">
      <div class="page-header">
        <div class="page-back">
          <a href="perfil.html" class="back-btn"><i class="ti ti-arrow-left"></i></a>
          <div class="page-title">Editar perfil</div>
        </div>
      </div>
      <div class="avatar-section">
        <div class="avatar-big">U</div>
      </div>
      <div class="cyla-card">
        <div class="card-label">Informações pessoais</div>
        <div class="grid-2" style="gap:10px;margin-bottom:12px;">
          <div class="form-group" style="margin-bottom:0;">
            <label class="form-label">Nome</label>
            <input type="text" id="ep-nome" class="form-input" value="Usuário">
          </div>
          <div class="form-group" style="margin-bottom:0;">
            <label class="form-label">Sobrenome</label>
            <input type="text" id="ep-sobrenome" class="form-input" value="">
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">E-mail</label>
          <input type="email" id="ep-email" class="form-input" value="usuario@email.com">
        </div>
      </div>
      <div class="cyla-card">
        <div class="card-label">Perfil público</div>
        <div class="form-group">
          <label class="form-label">Nome de usuário</label>
          <input type="text" id="ep-username" class="form-input" value="@usuario">
        </div>
      </div>
      <div class="cyla-card">
        <div class="card-label">Alterar senha</div>
        <div class="form-group">
          <label class="form-label">Nova senha</label>
          <input type="password" id="ep-senha" class="form-input" placeholder="••••••••">
        </div>
        <div class="form-group">
          <label class="form-label">Confirmar senha</label>
          <input type="password" id="ep-confirmar" class="form-input" placeholder="••••••••">
        </div>
      </div>
      <button class="btn-primary" id="btn-salvar-perfil">
        <i class="ti ti-check"></i> Salvar alterações
      </button>
    </div>
    <nav class="bottom-nav">
      <a href="home.html" class="bnav-item"><i class="ti ti-home"></i><span>Início</span></a>
      <a href="progresso.html" class="bnav-item"><i class="ti ti-chart-bar"></i><span>Progresso</span></a>
      <a href="registro.html" class="bnav-item"><div class="bnav-fab"><i class="ti ti-plus"></i></div></a>
      <a href="amigos.html" class="bnav-item"><i class="ti ti-users"></i><span>Amigos</span></a>
      <a href="perfil.html" class="bnav-item active"><i class="ti ti-user-circle"></i><span>Perfil</span></a>
    </nav>
  </div>
</div>
</body>
</html>
